name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Pushes to main publish a release with the next patch version. Running the workflow by hand publishes a
  # release of the selected branch, with a version of your choice (for minor and major releases).
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0. The release is tagged v<version>. Empty for the next patch version.
        required: false
        type: string
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

concurrency:
  # Runs that can release (pushes and manual runs) share one group and are never cancelled, so they don't overlap:
  # the version picked by the version job stays free until the release, and an approved release always finishes.
  # A run waiting in the queue is replaced by a newer one. Pull request runs are cancelled by newer pushes.
  group: ${{ github.workflow }}|${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Picks the version before the builds, since it's built into the app. Pull request builds use the next version too,
  # as Velopack refuses to pack a version that isn't newer than the latest release.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Determine version
        id: version
        # Explicitly bash, for pipefail: a failed tag lookup must not fall back to 0.0.1.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment so the input is never interpreted as script.
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            # The next patch version after the highest vX.Y.Z tag.
            last="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed -n 's|^refs/tags/v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$|\1|p' \
              | sort -V | tail -n 1)"
            IFS=. read -r major minor patch <<< "${last:-0.0.0}"
            version="${major}.${minor}.$(( 10#${patch} + 1 ))"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version \"${version}\" isn't a version number like 1.2.0."
            exit 1
          fi
          echo "Version: ${version} (release: ${RELEASE})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MeowGodotLauncher.slnx -c Release

      - name: Test
        run: dotnet test MeowGodotLauncher.slnx -c Release --no-build

  publish:
    name: Publish (${{ matrix.rid }})
    needs: [test, version]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/MeowGodotLauncher/MeowGodotLauncher.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version="${VERSION}" -o publish

      - name: Install Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "${HOME}/.dotnet/tools" >> "$GITHUB_PATH"
          # AppImages are made with mksquashfs.
          if [[ "${{ runner.os }}" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y squashfs-tools
          fi

      # For releases, the macOS packages are made again by the sign-macos job, signed and notarized when the signing
      # secrets are set. These aren't signed as a whole (only the executable is, ad-hoc, by the linker).
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/pack.sh ${{ matrix.rid }} publish "${VERSION}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MeowGodotLauncher-${{ matrix.rid }}
          path: artifacts/*

      # The files sign-macos packages from, in a tarball since artifacts lose the executable permission.
      - name: Archive publish folder
        if: runner.os == 'macOS' && needs.version.outputs.release == 'true'
        run: tar -cf publish.tar publish

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS' && needs.version.outputs.release == 'true'
        with:
          name: publish-${{ matrix.rid }}
          path: publish.tar

  # Waits for approval from the `release` environment's reviewer. It comes before signing so that only builds
  # going into a release are notarized (Apple limits notarizations per day, shared with the Godot fork).
  release-approval:
    name: Release approval
    needs: [version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - name: Approved
        run: echo "Release v${{ needs.version.outputs.version }} approved."

  sign-macos:
    name: Sign and notarize (${{ matrix.rid }})
    # Only for releases, never for pull requests: code from a pull request never runs next to the signing secrets.
    needs: [version, release-approval]
    runs-on: macos-latest
    # Holds the signing secrets. Limited to the main branch, without required reviewers.
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check signing secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          names=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          missing=()
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} == ${#names[@]} )); then
            echo "::notice::No signing secrets set, keeping the ad-hoc signed app."
          elif (( ${#missing[@]} > 0 )); then
            echo "::error::Some signing secrets are missing: ${missing[*]}"
            exit 1
          else
            echo "SIGN=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SIGN == 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SIGN == 'true'
        with:
          name: publish-${{ matrix.rid }}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: env.SIGN == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack
        if: env.SIGN == 'true'
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "${HOME}/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Import the signing certificate
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Optional repository variable, to pick a certificate by name when there are several.
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY || 'Developer ID Application' }}
        run: |
          # Import the certificate into a temporary keychain, deleted in the clean up step.
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          rm "${RUNNER_TEMP}/certificate.p12"
          # The runners don't trust a Developer ID certificate without Apple's intermediate, which an exported
          # .p12 usually doesn't include.
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | awk -v name="\"${SIGNING_IDENTITY}" 'index($0, name) { print $2; exit }')"
          if [[ -z "${identity}" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 holds no \"${SIGNING_IDENTITY}\" certificate with its private key."
            exit 1
          fi

          echo "IDENTITY=${identity}" >> "$GITHUB_ENV"

      # Velopack signs the app with everything in it (the libraries, and the updater it adds), notarizes and staples it.
      - name: Package, sign and notarize
        if: env.SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          key="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${key}"
          xcrun notarytool store-credentials notary --key "${key}" --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" --keychain "${keychain}"

          tar -xf publish.tar
          bash packaging/pack.sh ${{ matrix.rid }} publish "${VERSION}" --signAppIdentity "${IDENTITY}" \
            --signEntitlements packaging/macos/MeowGodotLauncher.entitlements --notaryProfile notary --keychain "${keychain}"

      - name: Clean up
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/certificate.p12"

      # Replaces the ad-hoc signed packages, so the release picks up the signed and notarized ones.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.SIGN == 'true'
        with:
          name: MeowGodotLauncher-${{ matrix.rid }}
          path: artifacts/*
          overwrite: true

  release:
    name: Release
    needs: [version, sign-macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MeowGodotLauncher-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          # Creates the tag on the commit that was built.
          gh release create "${TAG}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Meow Godot Launcher ${TAG}" \
            --generate-notes ${PRERELEASE}
