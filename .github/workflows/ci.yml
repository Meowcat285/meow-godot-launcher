name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Running the workflow by hand publishes a release of the selected branch.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0. The release is tagged v<version>.
        required: true
        type: string
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

concurrency:
  # The event is part of the group so a push doesn't cancel a release run waiting for approval.
  group: ${{ github.workflow }}|${{ github.event_name }}|${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MeowGodotLauncher.slnx -c Release

      - name: Test
        run: dotnet test MeowGodotLauncher.slnx -c Release --no-build

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        env:
          # Passed through the environment so the input is never interpreted as script.
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.0' }}
        run: |
          version="${INPUT_VERSION}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version \"${version}\" isn't a version number like 1.2.0."
            exit 1
          fi
          dotnet publish src/MeowGodotLauncher/MeowGodotLauncher.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version="${version}" -o publish
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          name="MeowGodotLauncher-${{ matrix.rid }}"
          case "${{ matrix.rid }}" in
            win-*)
              7z a "artifacts/${name}.zip" ./publish/MeowGodotLauncher.exe
              ;;
            linux-*)
              chmod +x publish/MeowGodotLauncher
              tar -czf "artifacts/${name}.tar.gz" -C publish MeowGodotLauncher
              ;;
            osx-*)
              app="Meow Godot Launcher.app"
              mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
              cp publish/MeowGodotLauncher "${app}/Contents/MacOS/"
              cp packaging/macos/MeowGodotLauncher.icns "${app}/Contents/Resources/"
              sed "s/\$VERSION/${VERSION}/g" packaging/macos/Info.plist > "${app}/Contents/Info.plist"
              # Ad-hoc signature, which Apple Silicon requires to run at all. Outside pull requests, the
              # sign-macos job replaces it with a Developer ID signature when the signing secrets are set.
              codesign --force --deep --sign - "${app}"
              ditto -c -k --keepParent "${app}" "artifacts/${name}.zip"
              ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MeowGodotLauncher-${{ matrix.rid }}
          path: artifacts/*

  sign-macos:
    name: Sign and notarize (${{ matrix.rid }})
    needs: publish
    # Never on pull requests, so code from a pull request never runs next to the signing secrets.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # Holds the signing secrets. Limited to the main branch, without required reviewers.
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      APP: Meow Godot Launcher.app
      ZIP: MeowGodotLauncher-${{ matrix.rid }}.zip
    steps:
      - name: Check signing secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          names=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          missing=()
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} == ${#names[@]} )); then
            echo "::notice::No signing secrets set, keeping the ad-hoc signed app."
          elif (( ${#missing[@]} > 0 )); then
            echo "::error::Some signing secrets are missing: ${missing[*]}"
            exit 1
          else
            echo "SIGN=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SIGN == 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SIGN == 'true'
        with:
          name: MeowGodotLauncher-${{ matrix.rid }}
          path: unsigned

      - name: Sign
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Optional repository variable, to pick a certificate by name when there are several.
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY || 'Developer ID Application' }}
        run: |
          # Import the certificate into a temporary keychain, deleted in the clean up step.
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          rm "${RUNNER_TEMP}/certificate.p12"
          # The runners don't trust a Developer ID certificate without Apple's intermediate, which an exported
          # .p12 usually doesn't include.
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | awk -v name="\"${SIGNING_IDENTITY}" 'index($0, name) { print $2; exit }')"
          if [[ -z "${identity}" ]]; then
            security find-identity -p codesigning "${keychain}"
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 holds no \"${SIGNING_IDENTITY}\" certificate with its private key."
            exit 1
          fi

          ditto -x -k "unsigned/${ZIP}" app
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/MeowGodotLauncher.entitlements \
            --keychain "${keychain}" --sign "${identity}" "app/${APP}"
          codesign --verify --strict --verbose=2 "app/${APP}"

      - name: Notarize
        if: env.SIGN == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${key}"
          auth=(--key "${key}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER_ID}")

          ditto -c -k --keepParent "app/${APP}" "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" "${auth[@]}" --wait --timeout 1h \
            --output-format json > "${RUNNER_TEMP}/notarize.json" || true
          cat "${RUNNER_TEMP}/notarize.json"
          status="$(plutil -extract status raw "${RUNNER_TEMP}/notarize.json" 2> /dev/null || true)"
          if [[ "${status}" != "Accepted" ]]; then
            id="$(plutil -extract id raw "${RUNNER_TEMP}/notarize.json" 2> /dev/null || true)"
            [[ -n "${id}" ]] && xcrun notarytool log "${id}" "${auth[@]}" || true
            echo "::error::Notarization didn't succeed (status: ${status:-unknown})."
            exit 1
          fi

          xcrun stapler staple "app/${APP}"
          spctl --assess --type execute --verbose=2 "app/${APP}"
          mkdir -p artifacts
          ditto -c -k --keepParent "app/${APP}" "artifacts/${ZIP}"

      - name: Clean up
        if: always() && env.SIGN == 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/certificate.p12"

      # Replaces the ad-hoc signed artifact, so the release picks up the notarized app.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.SIGN == 'true'
        with:
          name: MeowGodotLauncher-${{ matrix.rid }}
          path: artifacts/*
          overwrite: true

  release:
    name: Release
    needs: [publish, sign-macos]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Requires approval from a reviewer before anything is published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          # Creates the tag on the commit that was built.
          gh release create "${TAG}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Meow Godot Launcher ${TAG}" \
            --generate-notes ${PRERELEASE}
