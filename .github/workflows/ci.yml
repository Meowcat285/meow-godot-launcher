name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MeowGodotLauncher.slnx -c Release

      - name: Test
        run: dotnet test MeowGodotLauncher.slnx -c Release --no-build

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || version="0.1.0"
          dotnet publish src/MeowGodotLauncher/MeowGodotLauncher.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version="${version}" -o publish
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          name="MeowGodotLauncher-${{ matrix.rid }}"
          case "${{ matrix.rid }}" in
            win-*)
              7z a "artifacts/${name}.zip" ./publish/MeowGodotLauncher.exe
              ;;
            linux-*)
              chmod +x publish/MeowGodotLauncher
              tar -czf "artifacts/${name}.tar.gz" -C publish MeowGodotLauncher
              ;;
            osx-*)
              app="Meow Godot Launcher.app"
              mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
              cp publish/MeowGodotLauncher "${app}/Contents/MacOS/"
              cp packaging/macos/MeowGodotLauncher.icns "${app}/Contents/Resources/"
              sed "s/\$VERSION/${VERSION}/g" packaging/macos/Info.plist > "${app}/Contents/Info.plist"
              # Not notarized, so give it an ad-hoc signature, which Apple Silicon requires to run at all.
              codesign --force --deep --sign - "${app}"
              ditto -c -k --keepParent "${app}" "artifacts/${name}.zip"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: MeowGodotLauncher-${{ matrix.rid }}
          path: artifacts/*

  release:
    name: Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Meow Godot Launcher ${GITHUB_REF_NAME}" \
            --generate-notes
